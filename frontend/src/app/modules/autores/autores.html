<h1>Autores</h1>

<p class="toolbar">
  <button (click)="listar(pagina() - 1)" [disabled]="pagina() == 0">Anterior</button>
  <button (click)="listar(pagina() + 1)" [disabled]="pagina() + 1 >= totalPaginas()">Siguiente</button>
  <span>Página {{ pagina() + 1 }} de {{ totalPaginas() }}</span>
</p>

<p>
  <label for="autor-id">ID:</label>
  <input id="autor-id" type="number" [(ngModel)]="id" />
  <button (click)="eliminar()">Eliminar</button>
</p>

<p>
  <textarea aria-label="Datos del autor" rows="3" cols="90" [(ngModel)]="cuerpo"></textarea>
  <button class="principal" (click)="guardar()">Guardar o Actualizar</button>
</p>

<div class="tabla">
  <table>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Nacionalidad</th>
      <th>Fecha de nacimiento</th>
    </tr>
    @for (autor of autores(); track autor.id) {
      <tr>
        <td>{{ autor.id }}</td>
        <td>{{ autor.nombre }}</td>
        <td>{{ autor.apellido }}</td>
        <td>{{ autor.nacionalidad }}</td>
        <td>{{ autor.fechaNacimiento }}</td>
      </tr>
    }
  </table>
</div>
